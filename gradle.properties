# Gradle 8 on Windows writes JVM argument files using the daemon charset.
# COMPAT matches the native launcher charset, including Korean project paths.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=COMPAT
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.overridePathCheck=true
